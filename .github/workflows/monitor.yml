name: charger-alert

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟检查一次（GitHub 免费额度下更安全；想更快改 */5）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charger-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: 恢复上次的监控状态
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: 检查订单
        env:
          SEMIOT_OPENID: ${{ secrets.SEMIOT_OPENID }}
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: python monitor.py --once

      - name: 保存监控状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
